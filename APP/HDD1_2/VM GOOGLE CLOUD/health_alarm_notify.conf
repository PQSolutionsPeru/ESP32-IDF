# Netdata Health Alert Notification Configuration
# For HDD-Monitor VM - Email alerts via Gmail SMTP
# Target: pqsolutionsperu@gmail.com

# ============================================
# GENERAL SETTINGS
# ============================================

# Enable email notifications
SEND_EMAIL="YES"

# Default recipient
DEFAULT_RECIPIENT_EMAIL="pqsolutionsperu@gmail.com"

# Email sender name
EMAIL_SENDER="HDD-Monitor Alerts <alerts@hddmonitor.com>"

# Email format (HTML for better formatting)
EMAIL_PLAIN_TEXT_ONLY="NO"

# ============================================
# GMAIL SMTP CONFIGURATION
# ============================================

# Gmail SMTP server
SMTP_SERVER="smtp.gmail.com:587"

# Gmail account
SMTP_USER="pqsolutionsperu@gmail.com"

# Gmail App Password (set via environment variable for security)
# IMPORTANT: Create App Password at https://myaccount.google.com/apppasswords
# Do NOT use your regular Gmail password
SMTP_PASS="${SMTP_APP_PASSWORD}"

# ============================================
# EMAIL TEMPLATE CUSTOMIZATION
# ============================================

# Email subject line
EMAIL_SUBJECT="[HDD-Monitor VM] ${status} on ${host}: ${alarm}"

# Email headers
EMAIL_HEADERS="From: HDD-Monitor Alerts <alerts@hddmonitor.com>
Reply-To: pqsolutionsperu@gmail.com
X-Priority: 1
X-Mailer: Netdata"

# ============================================
# ALERT ROLES CONFIGURATION
# ============================================

# Role definitions (who receives what alerts)
role_recipients_email[sysadmin]="pqsolutionsperu@gmail.com"
role_recipients_email[admin]="pqsolutionsperu@gmail.com"
role_recipients_email[root]="pqsolutionsperu@gmail.com"

# ============================================
# NOTIFICATION SETTINGS
# ============================================

# Send clear notifications when alerts resolve
SEND_CLEAR="YES"

# Notification timeout (how long to wait before giving up)
NOTIFICATION_TIMEOUT="30"

# ============================================
# RATE LIMITING
# ============================================

# These are handled by Netdata's built-in delay mechanisms
# in the health.d/*.conf files:
# - delay: down 15m multiplier 1.5 max 2h
#
# This prevents alert spam while ensuring critical issues
# are not missed

# ============================================
# DEBUGGING
# ============================================

# Enable debug mode (uncomment for troubleshooting)
# DEBUG_NOTIFICATIONS="YES"

# ============================================
# ADDITIONAL NOTIFICATION METHODS (DISABLED)
# ============================================

# Slack, Discord, PagerDuty, etc. can be configured here
# For now, only email is enabled

SEND_SLACK="NO"
SEND_DISCORD="NO"
SEND_PUSHOVER="NO"
SEND_PUSHBULLET="NO"
SEND_TELEGRAM="NO"
SEND_TWILIO="NO"
SEND_MESSAGEBIRD="NO"
SEND_PD="NO"

# ============================================
# NOTES
# ============================================
#
# 1. Gmail App Password Setup:
#    - Go to: https://myaccount.google.com/apppasswords
#    - Generate 16-character app password
#    - Add to: /etc/systemd/system/netdata.service.d/override.conf
#
# 2. Test notifications:
#    sudo su -s /bin/bash netdata
#    /usr/libexec/netdata/plugins.d/alarm-notify.sh test
#
# 3. View notification logs:
#    sudo journalctl -u netdata | grep alarm-notify
#
# 4. Email format includes:
#    - Alert severity (WARNING/CRITICAL)
#    - Resource name
#    - Current value
#    - Threshold crossed
#    - Direct link to dashboard
#    - Timestamp
