# Systemd Override for Netdata Service
# Path: /etc/systemd/system/netdata.service.d/override.conf
#
# This file adds environment variables to the Netdata service
# MUST be placed in: /etc/systemd/system/netdata.service.d/override.conf

[Service]
# Gmail App Password for SMTP notifications
# IMPORTANT: Replace xxxx_xxxx_xxxx_xxxx with your actual 16-character App Password
# Get it from: https://myaccount.google.com/apppasswords
Environment="SMTP_APP_PASSWORD=xxxx_xxxx_xxxx_xxxx"

# Optional: Additional environment variables
# Environment="TZ=America/Lima"
