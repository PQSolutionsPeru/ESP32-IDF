# Netdata CPU Alert Configuration
# For HDD-Monitor VM - Critical system monitoring
# VM has 2 vCPUs

# ============================================
# CPU USAGE WARNING (>90% for 10 minutes)
# ============================================
alarm: cpu_usage_high_warning
   on: system.cpu
   os: linux
 host: *
lookup: average -10m unaligned of user,system
units: %
every: 1m
 warn: $this > 90
delay: down 15m multiplier 1.5 max 1h
 info: average CPU utilization over the last 10 minutes is above 90%
   to: sysadmin

# ============================================
# CPU USAGE CRITICAL (>95% for 10 minutes)
# ============================================
alarm: cpu_usage_high_critical
   on: system.cpu
   os: linux
 host: *
lookup: average -10m unaligned of user,system
units: %
every: 1m
 crit: $this > 95
delay: down 15m multiplier 1.5 max 1h
 info: average CPU utilization over the last 10 minutes is above 95% - IMMEDIATE ACTION REQUIRED
   to: sysadmin

# ============================================
# CPU IOWAIT HIGH WARNING (>40% for 10 minutes)
# ============================================
alarm: cpu_iowait_high_warning
   on: system.cpu
   os: linux
 host: *
lookup: average -10m unaligned of iowait
units: %
every: 1m
 warn: $this > 40
delay: down 15m multiplier 1.5 max 1h
 info: average CPU iowait over the last 10 minutes is above 40% - possible disk bottleneck
   to: sysadmin

# ============================================
# CPU IOWAIT HIGH CRITICAL (>60% for 10 minutes)
# ============================================
alarm: cpu_iowait_high_critical
   on: system.cpu
   os: linux
 host: *
lookup: average -10m unaligned of iowait
units: %
every: 1m
 crit: $this > 60
delay: down 15m multiplier 1.5 max 1h
 info: average CPU iowait over the last 10 minutes is above 60% - severe disk bottleneck
   to: sysadmin

# ============================================
# LOAD AVERAGE WARNING (>3.0 for 2-CPU system)
# ============================================
alarm: load_average_15_warning
   on: system.load
   os: linux
 host: *
 calc: $load15
units: load
every: 1m
 warn: $this > 3
delay: down 15m multiplier 1.5 max 1h
 info: 15-minute load average is above 3.0 (system has 2 CPUs)
   to: sysadmin

# ============================================
# LOAD AVERAGE CRITICAL (>4.0 for 2-CPU system)
# ============================================
alarm: load_average_15_critical
   on: system.load
   os: linux
 host: *
 calc: $load15
units: load
every: 1m
 crit: $this > 4
delay: down 15m multiplier 1.5 max 1h
 info: 15-minute load average is above 4.0 - system is severely overloaded
   to: sysadmin
