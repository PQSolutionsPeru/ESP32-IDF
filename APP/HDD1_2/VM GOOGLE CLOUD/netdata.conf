# Netdata Configuration
# For HDD-Monitor VM (hddm.pqsolutionsperu.com)
# Optimized for 2GB RAM, 30GB disk Debian 12 VM

[global]
    # Database engine - efficient time-series storage
    memory mode = dbengine

    # Memory settings (32MB page cache)
    page cache size = 32

    # Disk space for metrics (128MB for historical data)
    dbengine disk space = 128

    # Update frequency (1 second default)
    update every = 1

    # History retention (1 day with 128MB)
    history = 86400

[web]
    # Bind to localhost only (Nginx will proxy)
    bind to = 127.0.0.1:19999

    # Only accept connections from localhost
    allow connections from = localhost

    # Enable gzip compression
    enable gzip compression = yes

[health]
    # Enable health monitoring and alerts
    enabled = yes

    # Default repeat intervals for warnings
    default repeat warning = every 1h

    # Default repeat intervals for critical alerts
    default repeat critical = every 15m

    # Run health checks every second
    run at least every seconds = 1

[plugins]
    # Enable essential plugins only
    proc = yes
    diskspace = yes
    cgroups = yes
    tc = no
    idlejitter = no

[plugin:proc]
    # System monitoring
    /proc/net/dev = yes
    /proc/diskstats = yes
    /proc/meminfo = yes
    /proc/stat = yes
    /proc/uptime = yes
    /proc/loadavg = yes
    /proc/sys/kernel/random/entropy_avail = yes

[plugin:proc:/proc/diskstats]
    # Monitor root filesystem
    enable new disks detected at runtime = yes

[plugin:proc:/proc/net/dev]
    # Monitor network interfaces
    enable new interfaces detected at runtime = yes
