[Unit]
Description=MQTT Firestore Service for Fire Panel Monitoring
After=network-online.target
Wants=network-online.target
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Type=simple
User=pqsolutionsperu
Group=pqsolutionsperu
WorkingDirectory=/home/pqsolutionsperu
ExecStart=/usr/bin/python3 /home/pqsolutionsperu/mqtt_firestore_handler.py
Restart=always
RestartSec=30
TimeoutStopSec=60

# Límites de recursos
MemoryMax=512M
CPUQuota=50%
LimitNOFILE=65535

# Logs
StandardOutput=append:/var/log/mqtt_firestore_handler.log
StandardError=append:/var/log/mqtt_firestore_handler.error.log

# Configuración de seguridad
PrivateTmp=true
NoNewPrivileges=true
ProtectSystem=full
ProtectHome=read-only
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
SystemCallArchitectures=native

# Variables de entorno
Environment=PYTHONUNBUFFERED=1
Environment=MQTT_KEEPALIVE=60
Environment=MQTT_QOS=1

[Install]
WantedBy=multi-user.target