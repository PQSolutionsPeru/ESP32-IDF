# Netdata RAM Alert Configuration
# For HDD-Monitor VM - Critical system monitoring
# VM has 2GB RAM total

# ============================================
# RAM UTILIZATION WARNING (>85%)
# ============================================
alarm: ram_in_use_warning
   on: system.ram
   os: linux
 host: *
 calc: $used * 100 / ($used + $cached + $free + $buffers)
units: %
every: 10s
 warn: $this > 85
delay: down 15m multiplier 1.5 max 1h
 info: system memory utilization is above 85%
   to: sysadmin

# ============================================
# RAM UTILIZATION CRITICAL (>95%)
# ============================================
alarm: ram_in_use_critical
   on: system.ram
   os: linux
 host: *
 calc: $used * 100 / ($used + $cached + $free + $buffers)
units: %
every: 10s
 crit: $this > 95
delay: down 15m multiplier 1.5 max 1h
 info: system memory utilization is above 95% - IMMEDIATE ACTION REQUIRED
   to: sysadmin

# ============================================
# SWAP UTILIZATION WARNING (>50%)
# ============================================
alarm: swap_in_use_warning
   on: system.swap
   os: linux
 host: *
 calc: $used * 100 / ($used + $free)
units: %
every: 10s
 warn: $this > 50
delay: down 15m multiplier 1.5 max 1h
 info: swap memory utilization is above 50% - system may be low on RAM
   to: sysadmin

# ============================================
# SWAP UTILIZATION CRITICAL (>80%)
# ============================================
alarm: swap_in_use_critical
   on: system.swap
   os: linux
 host: *
 calc: $used * 100 / ($used + $free)
units: %
every: 10s
 crit: $this > 80
delay: down 15m multiplier 1.5 max 1h
 info: swap memory utilization is above 80% - system critically low on RAM
   to: sysadmin

# ============================================
# AVAILABLE RAM CRITICAL (<100MB)
# ============================================
alarm: ram_available_critical
   on: mem.available
   os: linux
 host: *
 calc: $avail
units: MB
every: 10s
 crit: $this < 100
delay: down 15m multiplier 1.5 max 1h
 info: available RAM is less than 100MB - system may become unresponsive
   to: sysadmin
