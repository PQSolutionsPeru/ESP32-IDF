# Netdata Disk Space Alert Configuration
# For HDD-Monitor VM - Critical system monitoring

# ============================================
# DISK SPACE WARNING (>80%)
# ============================================
alarm: disk_full_warning
   on: disk.space
   os: linux
 host: *
 calc: $used
units: %
every: 1m
 warn: $this > 80
delay: down 15m multiplier 1.5 max 2h
 info: disk space utilization is above 80%
   to: sysadmin

# ============================================
# DISK SPACE CRITICAL (>90%)
# ============================================
alarm: disk_full_critical
   on: disk.space
   os: linux
 host: *
 calc: $used
units: %
every: 1m
 crit: $this > 90
delay: down 15m multiplier 1.5 max 2h
 info: disk space utilization is above 90% - IMMEDIATE ACTION REQUIRED
   to: sysadmin

# ============================================
# DISK INODES WARNING (>80%)
