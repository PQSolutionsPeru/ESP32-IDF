# ============================================
# NETDATA SERVICE DOWN (WARNING)
# ============================================
alarm: netdata_service_down
   on: systemd.service.state
   os: linux
 host: *
lookup: max -1m foreach failed of netdata*
units: state
every: 10s
 warn: $this == 1
delay: down 5m multiplier 1.5 max 1h
 info: Netdata monitoring service is in failed state - monitoring unavailable
   to: sysadmin

# ============================================
# RESOURCE MONITOR SERVICE DOWN (WARNING)
# ============================================
alarm: resource_monitor_service_down
   on: systemd.service.state
   os: linux
 host: *
lookup: max -1m foreach failed of resource-monitor*
units: state
every: 10s
 warn: $this == 1
delay: down 5m multiplier 1.5 max 1h
 info: Resource Monitor service is in failed state - custom monitoring unavailable
   to: sysadmin

# ============================================
# SERVICE RESTARTS (WARNING)
# Monitor excessive service restarts (>3 in 10 minutes)
# ============================================
alarm: service_restart_high
   on: systemd.service.restarts
   os: linux
 host: *
lookup: sum -10m foreach *
units: restarts
every: 1m
 warn: $this > 3
delay: down 15m multiplier 1.5 max 1h
 info: service has restarted more than 3 times in the last 10 minutes
   to: sysadmin
