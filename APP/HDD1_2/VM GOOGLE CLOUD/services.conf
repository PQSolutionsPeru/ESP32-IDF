# Netdata Service Monitoring Alert Configuration
# For HDD-Monitor VM - Critical services monitoring
# Monitors: hdd-monitor, mosquitto (MQTT), postgresql

# ============================================
# HDD-MONITOR SERVICE DOWN (CRITICAL)
# ============================================
alarm: hdd_monitor_service_down
   on: systemd.service.state
   os: linux
 host: *
lookup: max -1m foreach failed of hdd-monitor*
units: state
every: 10s
 crit: $this == 1
delay: down 5m multiplier 1.5 max 1h
 info: HDD-Monitor service is in failed state - CRITICAL SYSTEM DOWN
   to: sysadmin

# ============================================
# MOSQUITTO (MQTT) SERVICE DOWN (CRITICAL)
# ============================================
alarm: mosquitto_service_down
   on: systemd.service.state
   os: linux
