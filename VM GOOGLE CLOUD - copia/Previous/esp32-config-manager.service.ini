[Unit]
Description=MQTT Firestore Service for Fire Panel Monitoring
After=network-online.target
Wants=network-online.target
StartLimitIntervalSec=0

[Service]
Type=simple
User=pqsolutionsperu
Group=pqsolutionsperu
WorkingDirectory=/home/pqsolutionsperu
ExecStart=/usr/bin/python3 /home/pqsolutionsperu/esp32_config_manager.py
Restart=always
RestartSec=10
TimeoutStopSec=30
StandardOutput=append:/var/log/esp32_config_manager.log
StandardError=append:/var/log/esp32_config_manager.error.log
# Configuración de seguridad
PrivateTmp=true
NoNewPrivileges=true
ProtectSystem=full
ProtectHome=read-only
Environment=PYTHONUNBUFFERED=1

[Install]
WantedBy=multi-user.target